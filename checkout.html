<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | FarmConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🌿 FarmConnect</div>
        <div class="nav-links" id="nav-auth-area"></div>
    </nav>

    <main class="checkout-shell">
        <div class="checkout-card">
            <div class="checkout-layout">
                <section class="checkout-panel">
                    <h2>Secure Checkout</h2>
                    <p style="color:#6b7280; margin-top:10px; margin-bottom:24px;">Review your order before paying. This flow is set up for backend payment session creation before any real money is processed.</p>

                    <div class="input-group">
                        <label for="buyer-name">Full Name</label>
                        <input type="text" id="buyer-name" placeholder="Your full name" required>
                    </div>

                    <div class="input-group">
                        <label for="buyer-email">Email Address</label>
                        <input type="email" id="buyer-email" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="delivery-location">Delivery Location</label>
                        <input type="text" id="delivery-location" placeholder="Example: Lekki, Lagos" required>
                    </div>

                    <div class="checkout-actions">
                        <button type="button" class="checkout-cta" id="create-checkout-session">Create Payment Session</button>
                        <button type="button" class="checkout-cta secondary" onclick="window.location.href='index.html'">Continue Shopping</button>
                    </div>

                    <div id="checkout-status" class="checkout-status"></div>
                </section>

                <aside class="checkout-summary">
                    <h3>Order Summary</h3>
                    <div id="checkout-items"></div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="checkout-total">₦0</span>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="common.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
