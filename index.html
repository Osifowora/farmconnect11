<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmConnect | Fresh Bulk Produce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🌿 FarmConnect</div>
        <div class="nav-links" id="nav-auth-area"></div>
    </nav>
    <header class="hero">
        <h1>Farm to Business, Direct.</h1>
        <p>Buy fresh bulk produce directly from local farmers. Cut costs, reduce waste.</p>
    </header>
    <section class="controls-container">
        <div class="category-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="Vegetables">Vegetables</button>
            <button class="tab" data-filter="Fruits">Fruits</button>
            <button class="tab" data-filter="Grains">Grains</button>
            <button class="tab" data-filter="Tubers">Tubers</button>
        </div>
        <div class="search-section">
            <input type="text" id="search-bar" placeholder="Search rice, onions, or locations..." class="search-input">
        </div>
      
    </section>
    <main class="marketplace">
        <div class="section-header">
    <h2>Available Today in Lagos</h2>
    <span class="live-indicator">● Live</span>
    <select id="sort-select" class="sort-select">
        <option value="newest">Newest first</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
    </select>
</div>
        <div class="produce-grid" id="produce-grid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="common.js"></script>
    <script src="script.js"></script>
